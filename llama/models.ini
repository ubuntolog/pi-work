; llama.cpp router presets for a 128 GB Framework Desktop (Ryzen AI Max+ 395).
; The section name is the model ID pi shows in /model and that settings.json refers to.
; Start the router on the host with:  llama serve --models-preset llama/models.ini --host 127.0.0.1 --port 8080
; Keys are llama-server long options without the leading dashes.
; Check the Hugging Face repos and quantizations before the first run; newer ones may suit you better.

version = 1

; Main model: strongest agentic coder that fits comfortably (~63 GB, MXFP4).
[gpt-oss-120b]
load-on-startup = true
hf-repo = ggml-org/gpt-oss-120b-GGUF
ctx-size = 131072
parallel = 1
ngl = 999
jinja = true
chat-template-kwargs = {"reasoning_effort":"medium"}
temp = 1.0
top-p = 1.0
top-k = 0

; Fast coder, no thinking. Good for quick edits or as the explore subagent model (~32 GB at Q8_0).
[qwen3-coder-30b]
hf-repo = unsloth/Qwen3-Coder-30B-A3B-Instruct-GGUF:Q8_0
ctx-size = 131072
parallel = 1
ngl = 999
jinja = true
temp = 0.7
top-p = 0.8
top-k = 20
repeat-penalty = 1.05

; Small and very fast (~12 GB). Fits next to gpt-oss-120b; useful for subagents.
[gpt-oss-20b]
hf-repo = ggml-org/gpt-oss-20b-GGUF
ctx-size = 65536
parallel = 2
ngl = 999
jinja = true
chat-template-kwargs = {"reasoning_effort":"low"}
temp = 1.0
top-p = 1.0
top-k = 0
